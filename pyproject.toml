[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freddie-2019-credit-risk"
version = "0.1.0"
description = "Credit risk case study on the Freddie Mac SFLLD 2019 vintage sample."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "ruff>=0.5",
    "black>=24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]